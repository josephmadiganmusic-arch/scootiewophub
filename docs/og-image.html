<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Share image comp, 1200 x 630. docs/og-image.cjs embeds the fonts and the
     star as data URIs (file pages cannot fetch them cross origin) and shoots
     it with Playwright into public/og.jpg. Same look as the site hero. -->
<style>
@font-face { font-family: "Unbounded"; src: url("{{UNBOUNDED}}") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "Lato"; src: url("{{LATO}}") format("woff2"); font-weight: 900; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0A0A0A; }
.ground { position: absolute; inset: 0; background:
  radial-gradient(38% 30% at 18% 22%, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 100%),
  radial-gradient(40% 40% at 78% 60%, rgba(26,254,0,0.10) 0%, rgba(26,254,0,0) 100%),
  radial-gradient(110% 80% at 50% 40%, #151515 0%, #0C0C0C 55%, #060606 100%); }
.tile { position: absolute; left: 92px; top: 95px; width: 440px; height: 440px; border-radius: 48px; padding: 5px; box-sizing: border-box;
  background: linear-gradient(135deg, #FFFFFF 0%, #C9C9C9 9%, #5E5E5E 24%, #F4F4F4 44%, #6A6A6A 60%, #FFFFFF 76%, #7C7C7C 90%, #DCDCDC 100%);
  box-shadow: 0 0 0 1px #000, 0 40px 80px -24px rgba(0,0,0,0.98), 0 0 60px -14px rgba(255,255,255,0.14); }
.face { position: relative; width: 100%; height: 100%; border-radius: 43px; overflow: hidden;
  background: linear-gradient(180deg, #2A2A2A 0%, #161616 44%, #060606 50%, #0A0A0A 78%, #111111 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.16); }
.face::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.03)); }
.glow { position: absolute; inset: 16%; border-radius: 50%; background: radial-gradient(circle, rgba(26,254,0,0.6) 0%, rgba(26,254,0,0) 70%); filter: blur(28px); }
.star { position: absolute; inset: 13%; width: 74%; height: 74%; object-fit: contain; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.85)); transform: rotate(-4deg); }
.copy { position: absolute; left: 590px; top: 182px; font-family: "Unbounded"; font-weight: 800; text-transform: uppercase; line-height: 0.92; font-size: 74px; letter-spacing: -0.01em; }
.w { color: #F3F3F0; text-shadow: 0 1px 0 rgba(255,255,255,0.12), 0 -1px 0 rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.6); }
.g { color: #1AFE00; text-shadow: 0 0 30px rgba(26,254,0,0.35), 0 3px 0 rgba(0,0,0,0.6); }
.sub { position: absolute; left: 594px; top: 350px; font-family: "Lato"; font-weight: 900; font-size: 21px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(243,243,240,0.6); }
.pill { position: absolute; left: 594px; top: 404px; display: inline-block; padding: 16px 30px; border-radius: 999px; font-family: "Lato"; font-weight: 900; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; color: #070707;
  background: linear-gradient(180deg, #7DFF6B 0%, #1AFE00 46%, #0FB500 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), inset 0 -4px 0 rgba(0,0,0,0.22), 0 14px 28px -10px rgba(26,254,0,0.6), 0 18px 36px -14px rgba(0,0,0,0.9); }
.sp { position: absolute; width: 16px; height: 16px; background: linear-gradient(#fff,#fff) center/2px 100% no-repeat, linear-gradient(#fff,#fff) center/100% 2px no-repeat; filter: drop-shadow(0 0 5px #fff); }
</style>
</head>
<body>
<div class="ground"></div>
<div class="tile"><div class="face"><div class="glow"></div><img class="star" src="{{STAR}}"></div><div class="sp" style="left:22px;top:22px"></div><div class="sp" style="right:26px;bottom:26px;width:11px;height:11px"></div></div>
<div class="copy"><div class="w">Starrbaby</div><div class="g">Wrldwide</div></div>
<div class="sub">Music · Fashion · Lifestyle</div>
<div class="pill">Created to Create</div>
</body>
</html>
